<!doctype html>
<!-- The lang attribute and the document title are left empty on purpose and are
     set from the translation catalogue at runtime (see src/App.tsx). A.5 admits
     no hard-coded string, and index.html is where they usually hide. -->
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
